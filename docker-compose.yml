services:
  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      PORT: 4000
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "4000:4000"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://backend:4000
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://backend:4000
    depends_on:
      - backend
    ports:
      - "3000:3000"